# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy — MSM CampusOS Studio
#
# Place this file on the Linux VM at:
#   /etc/nginx/sites-available/msm-campusos-studio
#
# Then enable it:
#   sudo ln -s /etc/nginx/sites-available/msm-campusos-studio \
#              /etc/nginx/sites-enabled/msm-campusos-studio
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   Certbot will automatically fill in the SSL blocks marked below.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    # ── Replace with your actual domain ──────────────────────────────────────
    server_name yourdomain.com www.yourdomain.com;

    # ── Certbot will insert its ACME challenge block here automatically ───────
    # location /.well-known/acme-challenge/ { }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/msm-campusos-studio.access.log;
    error_log  /var/log/nginx/msm-campusos-studio.error.log warn;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Next.js static files — served directly by Nginx (fast path) ──────────
    # The Docker container exposes /_next/static via the standalone server,
    # but caching at the Nginx level avoids unnecessary proxy hops.
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # ── Public assets ─────────────────────────────────────────────────────────
    location /favicon.ico {
        proxy_pass  http://127.0.0.1:3000;
        add_header  Cache-Control "public, max-age=86400";
        access_log  off;
    }

    # ── Main proxy → Docker container on port 3000 ───────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;

        # Forward real client info to Next.js
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR / future use)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts — increase if you have long-running API routes
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 16k;
    }

    # ── After Certbot runs, it will append an SSL server block below ──────────
    # (Do not edit this comment — Certbot uses it as an anchor)
}

# ─────────────────────────────────────────────────────────────────────────────
# After running: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot will automatically:
#   1. Add SSL certificates to the block above
#   2. Create a second server { listen 443 ssl; ... } block
#   3. Add a redirect from port 80 → 443
# ─────────────────────────────────────────────────────────────────────────────
