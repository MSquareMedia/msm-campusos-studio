# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Build → Push → Deploy
#
# Trigger:  push to `main` (production) or `develop` (staging)
#           manual dispatch from the Actions UI
#
# Flow:
#   1. lint  — ESLint on the source
#   2. build — Docker multi-stage build + push to GitHub Container Registry
#   3. deploy — SSH into the Linux VM, pull the new image, restart the container
#
# Required GitHub Actions Secrets  (Settings → Secrets → Actions):
#
#   GHCR_TOKEN              Personal Access Token with `write:packages` scope
#                           (or use the auto-generated GITHUB_TOKEN — see note
#                            in the build job)
#
#   VM_HOST                 Public IP or hostname of the target Linux VM
#   VM_USER                 SSH username on the VM  (e.g. ubuntu / ec2-user)
#   VM_SSH_PASSWORD         SSH password for the above user
#   VM_SSH_PORT             SSH port  (default 22, optional)
#
#   # ── Runtime environment variables injected into the container ──────────
#   DATABASE_URL            Neon / Postgres connection string
#   ANTHROPIC_API_KEY       Anthropic SDK key
#   UPSTASH_REDIS_REST_URL  Upstash Redis REST endpoint
#   UPSTASH_REDIS_REST_TOKEN Upstash Redis token
#
#   # ── Build-time NEXT_PUBLIC_* vars (baked into the JS bundle) ─────────
#   NEXT_PUBLIC_APP_URL     e.g. https://yourdomain.com
#   NEXT_PUBLIC_SITE_NAME   e.g. "MSM CampusOS Studio"
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main       # production
      - develop    # staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production / staging)"
        required: false
        default: "production"

# Concurrency: cancel in-flight runs on the same branch so we never deploy
# an older commit on top of a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository preserves casing — jobs lowercase it before use
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Docker requires all-lowercase image names; org names like MSquareMedia
      # contain uppercase letters that cause "invalid reference format" errors.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Expose a short commit SHA for tagging
      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Enable multi-platform builds and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Use the fine-grained GHCR_TOKEN secret, or fall back to the
          # auto-provided GITHUB_TOKEN (works for public repos / same-org pushes)
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate OCI-compliant image tags + labels automatically
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag: branch name  (main → latest, develop → develop)
            type=ref,event=branch
            # Tag: short commit SHA  e.g. sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # Tag: semver if a version tag is pushed  e.g. v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=MSM CampusOS Studio
            org.opencontainers.image.description=Next.js production image
            org.opencontainers.image.vendor=MSquareMedia

      # Build the multi-stage image and push all tags
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass NEXT_PUBLIC_* build-args from secrets
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_NAME=${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          # GitHub Actions cache — speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for Linux AMD64 (target VM architecture)
          platforms: linux/amd64

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Linux VM via SSH
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VM
    runs-on: ubuntu-latest
    needs: build

    # Only deploy from main (production) or develop (staging)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    # Map branch → environment name for protection rules / env URLs
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout source (for compose file, if needed)
        uses: actions/checkout@v4

      # Keep image name lowercase (same fix as build job)
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── Determine the exact image tag to deploy ───────────────────────
      - name: Set deploy image tag
        id: tag
        run: |
          SHORT_SHA="${{ needs.build.outputs.short_sha }}"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ── SSH into the VM — zero-downtime blue/green swap ──────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_SSH_PASSWORD }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          # Blue-green deployment strategy:
          #   1. Pull new image
          #   2. Boot new container on alternate internal port
          #   3. Health-check the new slot (up to 60 s)
          #   4. Atomically reload nginx upstream → zero dropped requests
          #   5. Drain in-flight requests (5 s grace)
          #   6. Tear down old container
          #
          # Prerequisites on the VM:
          #   • nginx installed and managing /etc/nginx/conf.d/campusos-upstream.conf
          #   • sudoers entry allowing VM_USER to run nginx without a password:
          #       <VM_USER> ALL=(ALL) NOPASSWD: /usr/sbin/nginx
          script: |
            set -euo pipefail

            REGISTRY="${{ env.REGISTRY }}"
            IMAGE="${{ steps.tag.outputs.image }}"
            NGINX_UPSTREAM="/etc/nginx/conf.d/campusos-upstream.conf"

            # Internal ports — never exposed directly to the internet
            BLUE_PORT=3001
            GREEN_PORT=3002

            BLUE="msm-campusos-studio-blue"
            GREEN="msm-campusos-studio-green"

            # ── Shared docker run flags ───────────────────────────────────
            run_container() {          # args: <name> <port>
              docker run -d \
                --name    "$1" \
                --restart unless-stopped \
                --memory  2g \
                --cpus    1.5 \
                -p        "$2:3000" \
                -e NODE_ENV=production \
                -e PORT=3000 \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                -e UPSTASH_REDIS_REST_URL="${{ secrets.UPSTASH_REDIS_REST_URL }}" \
                -e UPSTASH_REDIS_REST_TOKEN="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" \
                "$IMAGE"
            }

            # ── Determine active / idle slots ─────────────────────────────
            echo "▶ Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
              | docker login "$REGISTRY" \
                  --username "${{ github.actor }}" \
                  --password-stdin

            echo "▶ Pulling image: $IMAGE"
            docker pull "$IMAGE"

            if docker ps --filter "name=${BLUE}" --filter "status=running" -q | grep -q .; then
              ACTIVE_NAME="$BLUE"; ACTIVE_PORT=$BLUE_PORT
              NEW_NAME="$GREEN";   NEW_PORT=$GREEN_PORT
              echo "▶ Active slot: blue → deploying to: green (port $GREEN_PORT)"
            else
              ACTIVE_NAME="$GREEN"; ACTIVE_PORT=$GREEN_PORT
              NEW_NAME="$BLUE";     NEW_PORT=$BLUE_PORT
              echo "▶ Active slot: green → deploying to: blue (port $BLUE_PORT)"
            fi

            # ── Boot new container ─────────────────────────────────────────
            docker stop "$NEW_NAME" 2>/dev/null || true
            docker rm   "$NEW_NAME" 2>/dev/null || true

            echo "▶ Starting $NEW_NAME on internal port $NEW_PORT..."
            run_container "$NEW_NAME" "$NEW_PORT"

            # ── Health-check — wait up to 60 s ────────────────────────────
            echo "▶ Health-checking $NEW_NAME..."
            HEALTHY=false
            for i in $(seq 1 24); do
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
                            "http://127.0.0.1:${NEW_PORT}/" || true)
              echo "  Attempt $i/24 — HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                echo "✅ $NEW_NAME is healthy"
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Health check failed — rolling back"
              docker stop "$NEW_NAME" 2>/dev/null || true
              docker rm   "$NEW_NAME" 2>/dev/null || true
              exit 1
            fi

            # ── Switch nginx upstream (atomic, zero dropped connections) ───
            echo "▶ Switching nginx upstream → port $NEW_PORT"
            sudo tee "$NGINX_UPSTREAM" > /dev/null <<NGINX
            upstream campusos_app {
                server 127.0.0.1:${NEW_PORT};
            }
            NGINX
            sudo nginx -t
            sudo nginx -s reload
            echo "✅ nginx reloaded — traffic now on $NEW_NAME"

            # ── Drain in-flight requests then kill old slot ────────────────
            echo "▶ Waiting 5 s for in-flight requests to drain..."
            sleep 5

            echo "▶ Stopping old slot: $ACTIVE_NAME"
            docker stop "$ACTIVE_NAME" 2>/dev/null || true
            docker rm   "$ACTIVE_NAME" 2>/dev/null || true

            echo "▶ Pruning dangling images..."
            docker image prune -f

            echo "✅ Zero-downtime deployment complete — running containers:"
            docker ps --filter "name=msm-campusos-studio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Health-check (runs after deploy, non-blocking)
  # ─────────────────────────────────────────────────────────────────────────
  healthcheck:
    name: 🩺 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for app to become ready (max 60 s)
        run: |
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          echo "Checking $APP_URL ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$APP_URL" || true)
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ App is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "❌ App did not respond with 200 within 60 s"
          exit 1
